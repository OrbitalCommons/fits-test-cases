name: Check fixtures

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every FITS fixture is structurally intact, documented and binary
        run: python3 scripts/check_fixtures.py
